spring.application.name=hcx-ss-fhir-processor

# HDC-175: Disable Spring Boot Docker Compose integration — infrastructure is managed externally
spring.docker.compose.enabled=false

# HDC-213: DB credentials are injected by DbSecretsEnvironmentPostProcessor before context starts.
# DataSource and DSLContext are auto-configured by Spring Boot + jOOQ starter.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jooq.sql-dialect=POSTGRES

# HDC-175: Actuator — expose only health and loggers endpoints
management.endpoints.web.exposure.include=health,loggers
management.endpoint.loggers.enabled=true

# HDC-175: AWS region
aws.region=us-east-1

# HDC-175: AWS Secrets ARNs — placeholder values; set per environment profile.
aws.secrets.db-credentials-arn=
aws.secrets.keystore-password-arn=

# HDC-175: S3 keystore location — bucket and key for the SureScripts P12 client certificate.
aws.s3.keystore-bucket=hcx-ss-fhir-keystore
aws.s3.keystore-key=keystore/surescripts-qa.p12

# HDC-175: S3 FHIR output — bucket and key prefix where assembled FHIR JSON files are stored.
aws.s3.fhir-output-bucket=
aws.s3.fhir-output-key-prefix=

# HDC-175: SureScripts FHIR API base URL.
surescripts.fhir.base-url=https://staging.care-coordination.surescripts.net/ext/v1
