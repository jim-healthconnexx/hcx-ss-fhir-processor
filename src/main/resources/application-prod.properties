# HDC-175: Production profile — WARN logging, real AWS

aws.region=us-east-1

# HDC-175: DB credentials secret ARN for production. (Set when prod secret is provisioned)
aws.secrets.db-credentials-arn=arn:aws:secretsmanager:us-east-1:033147048355:secret:hcx/prod/db-credentials-jKsjzm

# HDC-175: SureScripts keystore password secret ARN for production.
aws.secrets.keystore-password-arn=arn:aws:secretsmanager:us-east-1:033147048355:secret:hcx/prod/keystorepassword-adW72o

# HDC-175: S3 keystore — production P12
aws.s3.keystore-bucket=hcx-ss-fhir-keystore-prod
aws.s3.keystore-key=keystore/surescripts-prod.p12

# HDC-214: Extra CA bundle for PROD.
aws.s3.truststore-key=keystore/prod.healthconnexx.com.p7b

# HDC-175: S3 FHIR output bucket and key prefix for production.
aws.s3.fhir-output-bucket=ss-inbound-prod
aws.s3.fhir-output-key-prefix=fhir/

# HDC-175: SureScripts production FHIR endpoint. (Confirm URL with Surescripts)
surescripts.fhir.base-url=https://care-coordination.surescripts.net/ext/v1

# HDC-239: Keep CapabilityStatement fetch disabled in production.
surescripts.fhir.capabilities-enabled=false

# HDC-245: CapabilityStatement URL for production. (Confirm URL with SureScripts)
surescripts.fhir.capabilities-url=https://care-coordination.surescripts.net/ext/v1/capabilities

# HDC-261: FHIR page size for production.
surescripts.fhir.page-count=1000

# HDC-233: ECS task trigger — prod cluster and hcx-ss-fhir-import task definition.
aws.ecs.enabled=true
aws.ecs.cluster-arn=arn:aws:ecs:us-east-1:033147048355:cluster/hcx-ss-process-prod
aws.ecs.task-definition-arn=hcx-ss-fhir-import-prod
aws.ecs.subnets=subnet-020d8d47c0b2e2c88,subnet-0822db3d5762d3c80
aws.ecs.security-groups=sg-0a6dfb8ba918c7941
aws.ecs.assign-public-ip=ENABLED

logging.level.root=INFO
