# HDC-175: Production profile — WARN logging, real AWS

aws.region=us-east-1

# HDC-175: DB credentials secret ARN for production. (Set when prod secret is provisioned)
aws.secrets.db-credentials-arn=PLACEHOLDER_PROD_DB_ARN

# HDC-175: SureScripts keystore password secret ARN for production.
aws.secrets.keystore-password-arn=PLACEHOLDER_PROD_KEYSTORE_PASSWORD_ARN

# HDC-175: S3 keystore — production P12
aws.s3.keystore-bucket=hcx-ss-fhir-keystore
aws.s3.keystore-key=keystore/surescripts-prod.p12

# HDC-175: S3 FHIR output bucket and key prefix for production.
aws.s3.fhir-output-bucket=PLACEHOLDER_PROD_S3_BUCKET
aws.s3.fhir-output-key-prefix=fhir/

# HDC-175: SureScripts production FHIR endpoint. (Confirm URL with Surescripts)
surescripts.fhir.base-url=PLACEHOLDER_PROD_FHIR_URL

# HDC-239: Keep CapabilityStatement fetch disabled in production.
surescripts.fhir.capabilities-enabled=false

# HDC-233: ECS task trigger — prod cluster and hcx-ss-fhir-import task definition.
aws.ecs.enabled=true
aws.ecs.cluster-arn=PLACEHOLDER_PROD_ECS_CLUSTER_ARN
aws.ecs.task-definition-arn=hcx-ss-fhir-import
aws.ecs.subnets=PLACEHOLDER_PROD_SUBNET_1,PLACEHOLDER_PROD_SUBNET_2
aws.ecs.security-groups=PLACEHOLDER_PROD_SECURITY_GROUP
aws.ecs.assign-public-ip=DISABLED

logging.level.root=WARN
